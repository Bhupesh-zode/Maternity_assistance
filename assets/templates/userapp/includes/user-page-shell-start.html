{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{% static 'userapp/plugins/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'userapp/plugins/icofont/icofont.min.css' %}">
  <link rel="stylesheet" href="{% static 'userapp/css/style.css' %}">
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</head>
<body id="top">
{% if messages %}
  {% for message in messages %}
  <script>swal({ title: "{{ message.tags|title }}", text: "{{ message }}", icon: "{% if message.tags == 'success' %}success{% elif message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}", button: "OK" });</script>
  {% endfor %}
{% endif %}
{% include 'userapp/includes/user-header.html' %}
<section class="page-title bg-2">
  <div class="overlay"></div>
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="block text-center">
          <h1 class="text-capitalize mb-3 text-lg">{{ page_heading }}</h1>
          {% if page_subtitle %}<p class="text-white mb-0">{{ page_subtitle }}</p>{% endif %}
        </div>
      </div>
    </div>
  </div>
</section>
<section class="section pt-4 pb-5">
  <div class="container">
