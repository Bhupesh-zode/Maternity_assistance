<label class="portal-theme-toggle portal-theme-toggle--header" for="portal-theme-toggle" title="Toggle dark mode">
  <input type="checkbox" id="portal-theme-toggle" aria-label="Dark mode">
  <span class="portal-theme-toggle-track">
    <span class="portal-theme-toggle-icons">
      <i class="icofont-sun" aria-hidden="true"></i>
      <i class="icofont-moon" aria-hidden="true"></i>
    </span>
  </span>
  <span class="portal-theme-toggle-label">Dark mode</span>
</label>
