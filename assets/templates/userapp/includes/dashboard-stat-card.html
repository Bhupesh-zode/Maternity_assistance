<div class="col-lg-4 col-md-4 mb-4">
  <div class="dashboard-stat-card h-100">
    <div class="dashboard-stat-icon"><i class="{{ icon }}"></i></div>
    <div class="dashboard-stat-value">{{ value }}</div>
    <div class="dashboard-stat-label">{{ label }}</div>
    {% if hint %}<div class="dashboard-stat-hint">{{ hint }}</div>{% endif %}
  </div>
</div>
