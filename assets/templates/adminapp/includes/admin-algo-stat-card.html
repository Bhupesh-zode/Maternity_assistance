<div class="col-12 col-md-4 d-flex">
  <div class="admin-algo-stat-card bg-light rounded h-100 w-100">    <div class="admin-algo-stat-card__icon">
      <i class="fa {{ icon }} fa-2x text-primary" aria-hidden="true"></i>
    </div>
    <div class="admin-algo-stat-card__body">
      <span class="admin-algo-stat-card__label">{{ label }}</span>
      <span class="admin-algo-stat-card__metric">Times used: <strong>{{ times_used }}</strong></span>
    </div>
  </div>
</div>
