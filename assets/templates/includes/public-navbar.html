{% load static %}
<header>
  <nav class="navbar navbar-expand-lg navigation" id="navbar">
    <div class="container">
      {% url 'home' as home_href %}
      {% include 'includes/site-logo.html' with logo_href=home_href %}
      <button class="navbar-toggler collapsed" type="button" data-toggle="collapse" data-target="#navbarmain" aria-controls="navbarmain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="icofont-navigation-menu"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarmain">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item {% if active_page == 'home' %}active{% endif %}"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
          <li class="nav-item {% if active_page == 'admin' %}active{% endif %}"><a class="nav-link" href="{% url 'adminlogin' %}">Admin</a></li>
          <li class="nav-item {% if active_page == 'user' %}active{% endif %}"><a class="nav-link" href="{% url 'userlogin' %}">User</a></li>
          <li class="nav-item {% if active_page == 'about' %}active{% endif %}"><a class="nav-link" href="{% url 'about' %}">About</a></li>
          <li class="nav-item {% if active_page == 'contact' %}active{% endif %}"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
          <li class="nav-item portal-theme-nav-item d-flex align-items-center">
            {% include 'userapp/includes/portal-theme-toggle.html' %}
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
