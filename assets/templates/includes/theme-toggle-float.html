<div class="theme-fab" id="themeFab">
  <label class="portal-theme-toggle portal-theme-toggle--float" for="theme-toggle-float" title="Toggle dark mode">
    <input type="checkbox" class="ma-theme-toggle-input" id="theme-toggle-float" aria-label="Dark mode">
    <span class="portal-theme-toggle-track">
      <span class="portal-theme-toggle-icons">
        <i class="icofont-sun" aria-hidden="true"></i>
        <i class="icofont-moon" aria-hidden="true"></i>
      </span>
    </span>
  </label>
</div>
